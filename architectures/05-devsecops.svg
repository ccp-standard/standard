<text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A">DevSecOps cryptographic architecture</text>
<text x="600" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5F5E5A">Centrally managed signing keys across the entire CI/CD pipeline</text>
