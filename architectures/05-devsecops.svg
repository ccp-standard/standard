<text x="600" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#534AB7">Supply chain security · SLSA Level 3 · Sigstore compatible · SOC 2 and PCI DSS audit trail</text>
<text x="600" y="822" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#534AB7">If an artifact has no valid Control Plane signature, the cluster will not deploy it</text>
