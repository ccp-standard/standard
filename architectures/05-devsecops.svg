<text x="600" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#00C2D4">ANKASecure© — Cryptographic Control Plane</text>
<text x="600" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#005F6B">Central signing key provider for the entire DevSecOps pipeline</text>
