name: Open Question Contribution
description: Contribute to one of the five foundational open questions of the CCP Standard.
title: "[Open Question] <short summary>"
labels: ["open-question", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for engaging with the CCP Standard. Use this template to contribute
        to one of the five foundational open questions. For free-form proposals, open a
        blank issue or a Discussion instead.
  - type: dropdown
    id: question
    attributes:
      label: Which open question does this address?
      options:
        - "1. Standardized CCP API specification"
        - "2. Conformance and certification"
        - "3. Open-source reference implementation"
        - "4. Integration with existing standards (NIST, ETSI, ISO)"
        - "5. Multi-cloud and hybrid deployment patterns"
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Your position or proposal
      description: Describe your view, proposal, or evidence. Reference prior art where relevant.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation (optional)
      description: Organization or capacity in which you contribute. Helps the community gauge diversity of input.
    validations:
      required: false
